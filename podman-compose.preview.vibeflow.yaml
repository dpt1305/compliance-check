services:
  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    expose:
      - "27017"

  app:
    build:
      context: ./compliance-nextjs
      dockerfile: Dockerfile.preview.vibeflow
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/compliance
      STORAGE_IMAGE_BASE_URL: /api/images/
      AWS_S3_BUCKET: ""
      STORAGE_IMAGE_PATH: ./data/images
      STORAGE_JSON_PATH: ./data/submissions.json
      STORAGE_JSON_ADMIN_PATH: ./data/admins.json
      EXCEL_UPDATE_PATH: ./data/tracking.xlsx
      JWT_SECRET: changeme-replace-in-production-must-be-256-bits-long!!
      JWT_EXPIRY_HOURS: "1"
      AI_GEMINI_ENABLED: "true"
      AI_GEMINI_ORDER: "0"
      AI_CHATGPT_ENABLED: "true"
      AI_CHATGPT_ORDER: "1"
      AI_NVIDIA_ENABLED: "false"
      AI_NVIDIA_ORDER: "2"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_RPM: "20"
      NOTIFICATION_MODE: teams
      REMINDER_DAYS_BEFORE: "7"
    depends_on:
      - mongo

volumes:
  mongodata: {}
