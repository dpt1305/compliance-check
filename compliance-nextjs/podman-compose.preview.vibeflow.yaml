services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.preview.vibeflow
    env_file:
      - .env.preview
    environment:
      - MONGODB_URI=mongodb://preview:preview@mongo:27017/compliance?authSource=admin
      - STORAGE_IMAGE_BASE_URL=/api/images/
      - AWS_S3_BUCKET=
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: preview
      MONGO_INITDB_ROOT_PASSWORD: preview
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongodata: {}
